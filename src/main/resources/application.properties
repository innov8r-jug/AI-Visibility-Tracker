# ===============================
# Server Configuration
# ===============================
server.port=9090
spring.application.name=ai-visibility-tracker

# ===============================
# AI API Configuration
# ===============================
# API URLs
google.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# API Keys (Replace these with your actual keys before testing!)
google.api.key=YOUR_GEMINI_API_KEY_HERE
groq.api.key=YOUR_GROQ_API_KEY_HERE

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_visibility_tracker
spring.datasource.username=postgres
spring.datasource.password=sodtgarfield
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Connection Pool (Recommended)
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PostgresHikariPool

# ===============================
# Logging
# ===============================
# Keep the console pattern clean
logging.pattern.console=%-5level [%thread] %logger{36} - %msg%n

# Show standard info logs for Spring, but show DEBUG logs for your specific code
# to watch the parallel AI threads in action!
logging.level.root=INFO
logging.level.com.writesonic.visibility=DEBUG