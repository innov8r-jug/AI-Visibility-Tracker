# ===============================
# Server Configuration
# ===============================

server.port=8081
spring.application.name=ai-visibility-tracker


# ===============================
# AI API Configuration
# ===============================

google.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
groq.api.url=https://api.groq.com/openai/v1/chat/completions

#google.api.key=${GOOGLE_API_KEY:}
#groq.api.key=${GROQ_API_KEY:}

google.api.key=ENTER_GOOGLE_API_KEY_HERE
groq.api.key=ENTER_GROQ_API_KEY_HERE

cerebras.api.url=https://api.cerebras.ai/v1/chat/completions
cerebras.api.key=ENTER_CEREBRAS_API_KEY_HERE
cerebras.api.model=gpt-oss-120b

cohere.api.url=https://api.cohere.com/v2/chat
cohere.api.key=ENTER_COHERE_API_KEY_HERE
cohere.api.model=command-a-plus-05-2026

# ===============================
# PostgreSQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_visibility_tracker}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# ===============================
# Connection Pool
# ===============================

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PostgresHikariPool


# ===============================
# Logging
# ===============================

logging.pattern.console=%-5level [%thread] %logger{36} - %msg%n

logging.level.root=INFO
logging.level.com.writesonic.visibility=DEBUG

# ===============================
# CORS - actual allowed origin(s), see config/WebConfig.java (single source of truth;
# controllers no longer carry their own @CrossOrigin annotations)
# ===============================
cors.allowed-origin-pattern=${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}